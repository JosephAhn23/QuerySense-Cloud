apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
  labels:
    app.kubernetes.io/name: querysense
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.web.port }}
    targetPort: http
    protocol: TCP
    name: http
{{- if .Values.metrics.enabled }}
  - port: {{ .Values.metrics.port }}
    targetPort: metrics
    protocol: TCP
    name: metrics
{{- end }}
  selector:
    app.kubernetes.io/name: querysense
    app.kubernetes.io/component: web
